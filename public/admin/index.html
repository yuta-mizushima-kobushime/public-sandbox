<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注文管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>注文管理</h1>
    <nav><a href="/">ショップへ</a></nav>
  </header>
  <main>
    <form id="login" class="card">
      <label>管理トークン<input type="password" name="token" required autocomplete="current-password"></label>
      <p><button type="submit">ログイン</button> <span id="login-error" class="error"></span></p>
    </form>

    <div id="dashboard" class="hidden">
      <div class="row">
        <button class="secondary" id="tab-orders">注文</button>
        <button class="secondary" id="tab-products">商品</button>
        <button class="secondary" id="logout">ログアウト</button>
      </div>

      <section id="orders-view">
        <h2>注文一覧</h2>
        <div class="row">
          <label for="status-filter">状態</label>
          <select id="status-filter" style="width:auto"></select>
          <span id="order-count" class="muted"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>注文番号</th><th>日時</th><th>注文者</th><th>お届け先</th><th>内容</th><th>合計</th><th>状態</th></tr></thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </section>

      <section id="products-view" class="hidden">
        <h2>商品一覧</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>商品名</th><th>価格</th><th>在庫</th><th>公開</th><th></th></tr></thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>
        <h2>商品を追加</h2>
        <form id="product-form" class="card">
          <div class="two-col">
            <label>商品名 *<input name="name" required></label>
            <label>香り<input name="scent"></label>
            <label>価格（円・税込）*<input name="price" type="number" min="0" required></label>
            <label>在庫数 *<input name="stock" type="number" min="0" required></label>
            <label>燃焼時間（時間）<input name="burn_time_hours" type="number" min="0"></label>
          </div>
          <label>説明<textarea name="description" rows="3"></textarea></label>
          <p><button type="submit">追加する</button> <span id="product-error" class="error"></span></p>
        </form>
      </section>
    </div>
  </main>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
